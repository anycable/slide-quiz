<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Quiz</title>
  <!-- Pinned to slide-quiz major.minor; bump it with every engine minor release -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slide-quiz@0.7/dist/participant.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .sq-loading { text-align: center; padding: 3rem 1rem; color: #888; }
    .sq-init-error { text-align: center; padding: 3rem 1rem; color: #c33; }
  </style>
</head>
<body>
  <div id="quiz-root"><p class="sq-loading">Connecting...</p></div>
  <!-- Pinned to slide-quiz major.minor; bump it with every engine minor release -->
  <script type="module">
    import { createParticipantUI } from 'https://cdn.jsdelivr.net/npm/slide-quiz@0.7/dist/participant.js';

    // Parameter names match QUIZ_URL_PARAMS in composables/useQuizManager.ts
    const params = new URLSearchParams(window.location.search);
    const wsUrl = params.get('wsUrl');
    const quizGroupId = params.get('quizGroupId');
    // Custom serverless paths (Vercel). Absent on Netlify, where the defaults apply.
    // Only same-origin paths are accepted, so a crafted link cannot send votes elsewhere.
    const samePath = (v) => (v && v.startsWith('/') && !v.startsWith('//') ? v : undefined);
    const endpoints = {};
    const answerPath = samePath(params.get('answer'));
    const syncPath = samePath(params.get('sync'));
    if (answerPath) endpoints.answer = answerPath;
    if (syncPath) endpoints.sync = syncPath;

    // The deck's accent colour; createParticipantUI applies it only if it is a valid CSS colour
    const accent = params.get('accent') || undefined;

    if (!wsUrl || !quizGroupId) {
      // Opened by URL instead of from the QR code, which carries the connection details
      document.getElementById('quiz-root').innerHTML =
        '<p class="sq-loading">Scan the QR code on the presenter\'s slide to join the quiz.</p>';
    } else {
      try {
        createParticipantUI('#quiz-root', { wsUrl, quizGroupId, endpoints, accent });
      } catch (e) {
        console.error('[slide-quiz] Init failed:', e);
        document.getElementById('quiz-root').innerHTML =
          '<p class="sq-init-error">Failed to connect. Please refresh or scan the QR code again.</p>';
      }
    }
  </script>
</body>
</html>
